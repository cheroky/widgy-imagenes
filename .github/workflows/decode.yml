name: decodificar-imagenes
on:
  push:
    paths: ['b64/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convertir base64 a PNG
        run: |
          for f in b64/*.b64; do n=$(basename "$f" .b64); base64 -d "$f" > "$n.png"; done
          git rm -q -r b64
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add *.png; git commit -m "Imágenes PNG del Marco Familia"; git push
